[package]
name = "zedsheet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
regex = "1.10.2"
gloo = "0.11.0"
console_error_panic_hook = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
  "CanvasRenderingContext2d",
  "TextMetrics",
  "ImageData",
  "ImageBitmap",
  "CanvasPattern",
  "CanvasGradient",
  "DomMatrix",
  "CanvasWindingRule",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlTextAreaElement",
  "HtmlElement",
  "Window",
  "console",
  "Event",
  "MouseEvent",
  "KeyboardEvent",
  "WheelEvent",
  "DomRect",
  "NodeList",
  "DomTokenList",
  "CssStyleDeclaration",
  "DomStringMap",
  "HtmlInputElement"
]
