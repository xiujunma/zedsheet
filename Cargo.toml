[package]
name = "zedsheet"
version = "0.1.1"
edition = "2021"
description = "Web spreadsheet in Rust/WebAssembly — canvas grid, formula engine, styling, merges, charts, CSV/XLSX import-export; embeds in any app via a small JS API"
license = "MIT"
repository = "https://github.com/xiujunma/zedsheet"
keywords = ["spreadsheet", "wasm", "webassembly", "canvas", "excel"]

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
regex = "1.10.2"
gloo = "0.11.0"
console_error_panic_hook = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.26"
rust_xlsxwriter = { version = "0.79", features = ["wasm"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "CanvasRenderingContext2d",
  "TextMetrics",
  "ImageData",
  "ImageBitmap",
  "CanvasPattern",
  "CanvasGradient",
  "DomMatrix",
  "CanvasWindingRule",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlTextAreaElement",
  "HtmlElement",
  "Window",
  "console",
  "Event",
  "MouseEvent",
  "KeyboardEvent",
  "WheelEvent",
  "DomRect",
  "NodeList",
  "DomTokenList",
  "CssStyleDeclaration",
  "DomStringMap",
  "HtmlInputElement",
  "HtmlIFrameElement",
  "HtmlSelectElement",
  "Storage"
]
